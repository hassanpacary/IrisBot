[project]
name = "iris-bot"
version = "1.0.0"
requires-python = ">3.13"
dependencies = [
    "easy-pil==0.4.0",
    "aiohttp==3.13.5",
    "aiosqlite==0.17.0",
    "asyncpraw==8.0.1",
    "discord.py==2.7.1",
    "ffmpeg-python==0.2.0",
    "nextcord==3.2.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "requests==2.33.1",
]

[project.optional-dependencies]
dev = [
    "black",
    "pylint",
    "isort",
]

[tool.black]
# Uses black to defaults style guide

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",   # Appear in the constants class, beacause there are no method
]

[tool.isort]
profile = "black"